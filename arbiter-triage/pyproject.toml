[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-triage"
version = "1.0.0"
description = "Arbiter Triage Engine — stateful real-time policy enforcement for AI queries"
requires-python = ">=3.11"
dependencies = [
    "uvloop>=0.19,<1.0",
    "spacy>=3.7,<4.0",
    "presidio-analyzer>=2.2,<3.0",
    "presidio-anonymizer>=2.2,<3.0",
    "transformers>=4.38,<5.0",
    "onnxruntime>=1.17,<2.0",
    "optimum>=1.17,<2.0",
    "aiosqlite>=0.20,<1.0",
    "cryptography>=42.0,<43.0",
    "opentelemetry-sdk>=1.23,<2.0",
    "opentelemetry-exporter-otlp>=1.23,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "hypothesis>=6.98,<7.0",
    "pytest-cov>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["arbiter_triage"]
