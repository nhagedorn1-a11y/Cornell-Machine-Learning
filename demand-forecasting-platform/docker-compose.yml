version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: forecasting-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forecasting}
      POSTGRES_USER: ${POSTGRES_USER:-forecasting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_in_prod}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecasting_user -d forecasting"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forecasting-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: forecasting-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - forecasting-network

  # MLflow for experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: forecasting-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-forecasting_user}:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-forecasting}
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-forecasting_user}:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-forecasting}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forecasting-network

  # API Gateway (FastAPI)
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: forecasting-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forecasting_user}:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-forecasting}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - ./ml_pipeline:/app/ml_pipeline
      - ./configs:/app/configs
    command: uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forecasting-network

  # Forecasting Service (ML Models)
  forecasting-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.forecasting
    container_name: forecasting-ml-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forecasting_user}:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-forecasting}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./ml_pipeline:/app/ml_pipeline
      - ./shared:/app/shared
      - ./configs:/app/configs
      - model_artifacts:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - forecasting-network

  # Ingestion Service (Data ETL)
  ingestion-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ingestion
    container_name: forecasting-ingestion
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forecasting_user}:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-forecasting}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      INGESTION_SCHEDULE: ${INGESTION_SCHEDULE:-0 */6 * * *}  # Every 6 hours
    volumes:
      - ./services/ingestion_service:/app/services/ingestion_service
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forecasting-network

  # Optional: Kafka for event streaming (commented out for MVP)
  # kafka:
  #   image: confluentinc/cp-kafka:latest
  #   container_name: forecasting-kafka
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #   depends_on:
  #     - zookeeper
  #   networks:
  #     - forecasting-network

  # Optional: Prometheus for metrics
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: forecasting-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   networks:
  #     - forecasting-network

  # Optional: Grafana for dashboards
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: forecasting-grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   networks:
  #     - forecasting-network

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  model_artifacts:
  # prometheus_data:
  # grafana_data:

networks:
  forecasting-network:
    driver: bridge
